services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: harbor
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harbor_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - harbor-postgres:/var/lib/postgresql/data
volumes:
  harbor-postgres:
